<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion des soignants</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Ajouter ou modifier un soignant</h1>
  <form id="profileForm">
    <input type="text" name="nom" placeholder="Nom" required>
    <textarea name="description" placeholder="Présentation" required></textarea>
    <input type="file" name="photo" accept="image/*" required>
    <select name="chambre" required>
      <option value="">Choisir une chambre</option>
      <script>
        for (let i = 1; i <= 10; i++) {
          document.write(`<option value="${i}">Chambre ${i}</option>`);
        }
      </script>
    </select>
    <button type="submit">Enregistrer</button>
  </form>
  <a class="link" href="index.html">Retour</a>

  <script>
    document.getElementById("profileForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const form = e.target;
      const reader = new FileReader();

      reader.onload = function() {
        const profiles = JSON.parse(localStorage.getItem("profiles") || "[]");
        profiles.push({
          nom: form.nom.value,
          description: form.description.value,
          photo: reader.result,
          chambre: form.chambre.value
        });
        localStorage.setItem("profiles", JSON.stringify(profiles));
        alert("Soignant ajouté !");
        form.reset();
      };
      reader.readAsDataURL(form.photo.files[0]);
    });
  </script>
</body>
</html>
